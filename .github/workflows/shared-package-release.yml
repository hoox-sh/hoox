name: Shared Package Release

on:
  push:
    tags:
      - "shared-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests for shared package
        run: bun test packages/shared || true

      - name: Build shared package
        run: bun run build:shared

      # ===== Publish to npm =====
      - name: Prepare @hoox-sh/hoox-shared for publishing
        run: bun scripts/prepare-publish.ts packages/shared

      - name: Setup Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Diagnose npm auth
        id: npm_whoami
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is empty"
            exit 1
          fi
          npm whoami

      - name: Publish @hoox-sh/hoox-shared to npm
        id: npm_shared
        continue-on-error: true
        run: cd packages/shared && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ===== Publish to GitHub Packages =====
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish @hoox-sh/hoox-shared to GitHub Packages
        # Idempotent on re-run (version may already exist from a prior release)
        continue-on-error: true
        run: |
          cd packages/shared
          npm publish --access public --ignore-scripts --registry https://npm.pkg.github.com || {
            echo "::warning::GitHub Packages publish skipped or failed (often E409 already exists)"
            exit 0
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog for this tag
        run: bun scripts/changelog-notes.ts "${{ github.ref_name }}" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Shared Package Release ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            packages/shared/package.json
            packages/shared/README.md

      - name: Fail if npm publish failed
        if: steps.npm_shared.outcome == 'failure' || steps.npm_whoami.outcome == 'failure'
        run: |
          echo "::error::npm registry publish failed. After renaming the npm account to hoox-sh, regenerate an automation token and update the GitHub secret NPM_TOKEN, then re-run 'Publish packages to npm' (workflow_dispatch)."
          exit 1
