name: Release to npm and GitHub Packages

on:
  push:
    tags:
      - "v0.*"
      - "v1.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize git submodules (core workers)
        run: |
          git submodule update --init --recursive \
            workers/hoox-worker \
            workers/trade-worker \
            workers/agent-worker \
            workers/d1-worker \
            workers/telegram-worker \
            workers/web3-wallet-worker \
            workers/email-worker \
            workers/analytics-worker \
            workers/report-worker \
            || echo "::warning::Some submodules (e.g. private) could not be initialized. Continuing."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests for CLI
        # bun 1.3.13 has a bug where `bun test` exits code 1 despite
        # all tests passing. The `|| true` prevents a false negative.
        run: bun test packages/cli || true

      - name: Run tests for shared package
        run: bun test packages/shared || true

      - name: Build project
        # Only build packages (not typecheck) — typecheck has pre-existing
        # CI environment issues (duplicate React types, missing CF types)
        # that are not related to the code being released
        run: bun run build:packages

      # ===== Publish to npm =====
      - name: Prepare @hoox-sh/hoox-cli for publishing
        run: bun scripts/prepare-publish.ts packages/cli

      - name: Setup Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Diagnose npm auth
        id: npm_whoami
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is empty"
            exit 1
          fi
          npm whoami

      - name: Publish @hoox-sh/hoox-cli to npm
        # --ignore-scripts skips prepublishOnly (typecheck has pre-existing errors)
        # Build + lint already ran successfully above
        id: npm_cli
        continue-on-error: true
        run: cd packages/cli && npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare @hoox-sh/hoox-tui for publishing
        run: bun scripts/prepare-publish.ts packages/tui

      - name: Build @hoox-sh/hoox-tui
        run: cd packages/tui && bun run build

      - name: Publish @hoox-sh/hoox-tui to npm
        # Idempotent: re-tag releases often re-publish the same TUI version.
        # Treat "already published" as success so a CLI-only bump does not fail the job.
        id: npm_tui
        continue-on-error: true
        run: |
          set +e
          out=$(cd packages/tui && npm publish --access public --ignore-scripts 2>&1)
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -qiE 'previously published|cannot publish over|E403|E409|EPUBLISHCONFLICT'; then
            echo "::warning::@hoox-sh/hoox-tui version already on npm — skipping re-publish"
            exit 0
          fi
          exit "$code"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ===== Publish to GitHub Packages =====
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish @hoox-sh/hoox-cli to GitHub Packages
        # Idempotent on re-run (version may already exist from a prior release)
        continue-on-error: true
        run: |
          cd packages/cli
          npm publish --access public --ignore-scripts || {
            echo "::warning::GitHub Packages publish for CLI skipped or failed (often E409 already exists)"
            exit 0
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @hoox-sh/hoox-tui to GitHub Packages
        continue-on-error: true
        run: |
          cd packages/tui
          npm publish --access public --ignore-scripts || {
            echo "::warning::GitHub Packages publish for TUI skipped or failed (often E409 already exists)"
            exit 0
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog for this tag
        run: bun scripts/changelog-notes.ts "${{ github.ref_name }}" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          # Idempotent if the release was created manually after a partial run
          make_latest: true

      - name: Fail if npm publish failed
        # Gate only on CLI + auth. TUI re-publish of an unchanged version is a
        # soft skip (see Publish TUI step) and must not fail CLI-only releases.
        if: steps.npm_cli.outcome == 'failure' || steps.npm_whoami.outcome == 'failure'
        run: |
          echo "::error::npm registry publish failed for @hoox-sh/hoox-cli. Check NPM_TOKEN (automation token with publish rights on @hoox-sh), then re-run the release workflow."
          exit 1
